<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not enabled — Swangz AI Hub</title>
<style>
  :root { --ink-0:#0A0A0B; --ink-1:#121214; --line:#242428; --tx-1:#F6F6F4; --tx-2:#A6A6A4; --accent:#F5B32B; --primary:#F5B32B; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(900px 500px at 50% -10%, rgba(245,179,43,.20), transparent 60%), var(--ink-0);
    color: var(--tx-1); font: 16px/1.6 system-ui, "Segoe UI", Roboto, Arial, sans-serif; display: grid; place-items: center; padding: 24px; }
  .card { width: min(520px, 100%); background: var(--ink-1); border: 1px solid var(--line); border-top: 3px solid var(--accent);
    border-radius: 18px; padding: 36px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.5), 0 28px 70px rgba(0,0,0,.6); }
  .mark { font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; color: var(--tx-2); }
  .mark b { color: #F0C054; }
  h1 { font-size: 1.6rem; margin: 14px 0 6px; }
  p { color: var(--tx-2); margin: 6px 0; }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
  button, a.btn { font: inherit; font-weight: 700; border-radius: 8px; padding: 11px 18px; cursor: pointer; text-decoration: none; }
  .primary { background: var(--primary); color: #1A1200; border: 0; }
  .ghost { background: none; color: var(--tx-1); border: 1px solid var(--line); }
  .ok { color: #5CE4B4; font-weight: 600; margin-top: 18px; }
  .policy { color: #71717A; font-size: 12.5px; margin-top: 26px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Swangz <b>AI</b></div>
    <h1 id="title">This tool isn't enabled for you</h1>
    <p id="reason"></p>
    <div class="row" id="actions"></div>
    <div id="done"></div>
    <p class="policy">Swangz AI Hub records which approved tool you open and for how long — never the pages or what you type.</p>
  </div>
<script src="blocked.js"></script>
</body>
</html>
