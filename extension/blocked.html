<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not enabled — Swangz AI</title>
<style>
  :root { --ink-0:#0D0D0D; --ink-1:#151515; --line:#2a2a2a; --tx-1:#F2F2F2; --tx-2:#A3A3A3; --accent:#E8B33C; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(900px 500px at 50% -10%, rgba(232,179,60,.08), transparent 60%), var(--ink-0);
    color: var(--tx-1); font: 16px/1.6 system-ui, "Segoe UI", Roboto, Arial, sans-serif; display: grid; place-items: center; padding: 24px; }
  .card { width: min(520px, 100%); background: var(--ink-1); border: 1px solid var(--line); border-top: 3px solid var(--accent);
    border-radius: 14px; padding: 36px; text-align: center; }
  .mark { font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; color: var(--tx-2); }
  .mark b { color: var(--accent); }
  h1 { font-size: 1.6rem; margin: 14px 0 6px; }
  p { color: var(--tx-2); margin: 6px 0; }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
  button, a.btn { font: inherit; font-weight: 700; border-radius: 8px; padding: 11px 18px; cursor: pointer; text-decoration: none; }
  .primary { background: var(--accent); color: #1b1305; border: 0; }
  .ghost { background: none; color: var(--tx-1); border: 1px solid var(--line); }
  .ok { color: #6CC08A; font-weight: 600; margin-top: 18px; }
  .policy { color: #6E6E6E; font-size: 12.5px; margin-top: 26px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Swangz <b>AI</b></div>
    <h1 id="title">This tool isn't enabled for you</h1>
    <p id="reason"></p>
    <div class="row" id="actions"></div>
    <div id="done"></div>
    <p class="policy">Swangz AI records which approved tool you open and for how long — never the pages or what you type.</p>
  </div>
<script src="blocked.js"></script>
</body>
</html>
