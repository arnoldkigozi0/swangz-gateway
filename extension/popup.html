<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --ink-0:#F5F3EE; --ink-1:#FFFFFF; --ink-2:#FAF9F6; --line:#E7E2D8; --tx-1:#111A2E; --tx-2:#4B5468; --accent:#86661C; --primary:#17233F; --ok:#2E8B57; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 320px; background: var(--ink-0); color: var(--tx-1);
    font: 14px/1.5 system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 9px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--ink-1); font-weight: 750; font-size: 14px; }
  header b { color: var(--accent); }
  .s { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(140deg, #22345C, #121C33); display: grid; place-items: center; color: #E2C27A; font-weight: 800; }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--tx-2); font-weight: 600; }
  input { background: var(--ink-1); border: 1px solid #D7D0C2; border-radius: 8px; padding: 9px 10px; color: var(--tx-1); font: inherit; }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(23, 35, 63, .12); }
  button { background: var(--primary); color: #fff; border: 0; border-radius: 8px; padding: 10px; font-weight: 700; cursor: pointer; }
  button.ghost { background: none; color: var(--tx-2); border: 1px solid var(--line); }
  .status { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .muted { color: var(--tx-2); font-size: 12.5px; }
  .err { color: #A8372F; font-size: 12.5px; min-height: 1em; }
  .policy { background: var(--ink-1); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--tx-2); font-size: 12.5px; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <header><span class="s">S</span><span>Swangz <b>AI</b> Access</span></header>
  <div class="body" id="body"></div>
  <script src="popup.js"></script>
</body>
</html>
