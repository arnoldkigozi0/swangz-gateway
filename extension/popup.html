<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --ink-0:#0D0D0D; --ink-1:#151515; --ink-2:#1E1E1E; --line:#2a2a2a; --tx-1:#F2F2F2; --tx-2:#A3A3A3; --accent:#E8B33C; --ok:#6CC08A; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 320px; background: var(--ink-0); color: var(--tx-1);
    font: 14px/1.5 system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 800; letter-spacing: .02em; text-transform: uppercase; font-size: 13px; }
  header b { color: var(--accent); }
  .s { width: 24px; height: 24px; border-radius: 5px; background: var(--ink-1); border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent); font-weight: 800; }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--tx-2); font-weight: 600; }
  input { background: var(--ink-0); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; color: var(--tx-1); font: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: #1b1305; border: 0; border-radius: 6px; padding: 10px; font-weight: 700; cursor: pointer; }
  button.ghost { background: none; color: var(--tx-2); border: 1px solid var(--line); }
  .status { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .muted { color: var(--tx-2); font-size: 12.5px; }
  .err { color: #D9776E; font-size: 12.5px; min-height: 1em; }
  .policy { background: var(--ink-1); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--tx-2); font-size: 12.5px; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <header><span class="s">S</span><span>Swangz <b>AI</b> Access</span></header>
  <div class="body" id="body"></div>
  <script src="popup.js"></script>
</body>
</html>
