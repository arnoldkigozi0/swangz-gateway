# Netlify config for the Swangz AI staff app + admin console.
# build-netlify.sh writes dist/ with a _redirects file that makes this site the gateway's "front door"
# (/api, /admin/api, /auth, /go and /icons are passed through to the gateway; everything else is the
# two single-page apps) and a _headers file with the security headers. See deploy/NETLIFY.md.
#
# In the Netlify UI: Base directory = deploy/netlify, and an environment variable SWANGZ_GATEWAY set to
# the gateway's https address. Change that variable and redeploy whenever the gateway address changes.

[build]
  publish = "dist"
  command = "bash build-netlify.sh"
