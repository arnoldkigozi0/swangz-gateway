name: Build the Swangz app
# Manual only: test artifacts, no signing, release publication or deployment.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: UNSIGNED-TEST (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tk for Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Existing build dependency
        run: python -m pip install pyinstaller
      - name: Record build tools
        run: |
          python --version
          python -m PyInstaller --version
      - name: Build standalone app
        run: python packaging/build.py
      - name: Smoke packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/smoke.py --binary dist/Swangz --report smoke-results/Linux.json
      - name: Smoke packaged app (macOS)
        if: runner.os == 'macOS'
        run: python packaging/smoke.py --binary dist/Swangz.app/Contents/MacOS/Swangz --report smoke-results/macOS.json
      - name: Smoke packaged app (Windows)
        if: runner.os == 'Windows'
        run: python packaging/smoke.py --binary dist/Swangz.exe --report smoke-results/Windows.json
      - name: Archive UNSIGNED-TEST app
        run: python packaging/archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: Swangz-UNSIGNED-TEST-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-UNSIGNED-TEST-${{ runner.os }}-${{ runner.arch }}
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 7
