name: macOS app (RC, unsigned)
# Builds Swangz.app and its DMG on macOS, then installs it from the DMG, launches it, enrols it against a gateway
# started here, restarts it, upgrades it from a previous build and uninstalls it. Artifacts are labelled
# "RC — UNSIGNED — INTERNAL TEST ONLY". Developer ID signing and notarization are not done here: they need
# Swangz's Apple account (docs/MACOS-SIGNING.md). Gatekeeper is never bypassed; its refusal is recorded.
on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'swangz_client/**'
      - 'gateway/enroll.py'
      - '.github/workflows/build-macos.yml'
  push:  # main gets its own RC artifact, so the release candidate is built from the merged tree
    branches: [main]
    paths:
      - 'packaging/**'
      - 'swangz_client/**'
      - 'gateway/enroll.py'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true
env:
  PYINSTALLER_VERSION: '6.22.3'  # pinned build tool (CI-side only; nothing is added to the app's runtime)
  CYCLONEDX_CLI_VERSION: '0.33.1'  # the official CycloneDX tool, CI-side only, checks the SBOM against the 1.5 schema
  CYCLONEDX_CLI_SHA256: '750c148780154833f6401f9067d08c5a4c31567b6ee3c26c062c3a95c62d741c'  # cyclonedx-osx-arm64
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tools (pinned)
        run: |
          # every build tool pinned by version AND sha256: a substituted wheel fails here
          grep -q "^pyinstaller==${PYINSTALLER_VERSION} " packaging/requirements-macos-build.txt
          python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-macos-build.txt
          python -m PyInstaller --version
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          sw_vers; uname -m; hdiutil info | head -3
      - name: Build the previous version (for the upgrade test)
        # The previous build is the version in the tree, which is also the server's minimum client version
        # (gateway/enroll.py CLIENT_MINIMUM), so the server accepts it. Replace with the last published RC once one exists.
        run: |
          OLD=$(python -c "exec(open('swangz_client/__init__.py').read()); print(__version__)")
          echo "PREVIOUS_VERSION=$OLD" >> "$GITHUB_ENV"
          python packaging/macos_dmg.py --dist dist-previous --work build/macos-previous
      - name: Build this version (patch number raised by the run number)
        # The app and its updater accept only MAJOR.MINOR.PATCH (swangz_client/updater.py version()),
        # so the RC number goes into PATCH: 0.1.0 -> 0.1.<run>. Always above the previous build and the server minimum.
        run: |
          IFS=. read -r MA MI PA <<< "$PREVIOUS_VERSION"
          NEW="${MA}.${MI}.$((PA + GITHUB_RUN_NUMBER))"
          echo "NEW_VERSION=$NEW" >> "$GITHUB_ENV"
          sed -i '' "s/^__version__ = .*/__version__ = \"${NEW}\"/" swangz_client/__init__.py
          python packaging/macos_dmg.py --dist dist --work build/macos
          git checkout -- swangz_client/__init__.py
      - name: Checksums
        run: |
          cd dist && shasum -a 256 -c ./*.dmg.sha256 && cat ./*.dmg.sha256 > SHA256SUMS && cat SHA256SUMS
          ls -l
      - name: SBOM (CycloneDX, shipped next to the DMG, checked by the official CycloneDX tool)
        # Lists the app, its Python runtime, the client code, every bundled native file with its SHA-256 and the
        # hash-pinned build tools. Fails if a third-party Python package is inside the app or the schema check fails.
        run: |
          SBOM="dist/Swangz-${NEW_VERSION}-macos.cdx.json"
          python packaging/sbom.py --program dist/Swangz.app --artifact dist/*.dmg --version "$NEW_VERSION" \
            --requirements packaging/requirements-macos-build.txt --epoch "$(git log -1 --format=%ct)" --out "$SBOM"
          CLI="$RUNNER_TEMP/cyclonedx"
          curl -fsSL -o "$CLI" "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${CYCLONEDX_CLI_VERSION}/cyclonedx-osx-arm64"
          echo "${CYCLONEDX_CLI_SHA256}  $CLI" | shasum -a 256 -c -
          chmod +x "$CLI"
          "$CLI" validate --input-file "$SBOM" --input-format json --input-version v1_5 --fail-on-errors
          echo "- SBOM $SBOM: valid CycloneDX 1.5 (cyclonedx-cli ${CYCLONEDX_CLI_VERSION})" >> "$GITHUB_STEP_SUMMARY"
      - name: Journey — install, launch, enrol, restart, upgrade, uninstall
        run: |
          python packaging/macos_journey.py --old dist-previous/*.dmg --new dist/*.dmg \
            --old-version "$PREVIOUS_VERSION" --new-version "$NEW_VERSION" --evidence evidence
      - name: Secret scan (app, DMG, checksums, SBOM and the journey logs)
        # The app is opened entry by entry (its module archive included); the DMG's compressed contents are the app itself.
        run: >-
          python packaging/secret_scan.py --report evidence/secret-scan.json --summary "$GITHUB_STEP_SUMMARY"
          --min-archives 2 dist evidence
      - name: Evidence summary
        if: always()
        run: python packaging/macos_summary.py --dist dist --evidence evidence --pyinstaller "$PYINSTALLER_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the RC and the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swangz-macos-RC-UNSIGNED-INTERNAL-TEST-ONLY
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/SHA256SUMS
            dist/*.cdx.json
            evidence/
          retention-days: 14
          if-no-files-found: warn
